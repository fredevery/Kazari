name: Sync Roadmap Issues and Project

on:
  workflow_dispatch: {}
  push:
    branches: [ main, rewrite ]
    paths:
      - '.project/prompts/**'
      - 'scripts/seed-project-and-issues.cjs'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
      repository-projects: write
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.ROADMAP_PAT }}
        run: node scripts/seed-project-and-issues.cjs
